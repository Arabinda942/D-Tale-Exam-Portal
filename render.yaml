services:
  - type: web
    name: dtale-exam-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_PIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dtale-db
          property: connectionString
databases:
  - name: dtale-db
    plan: free
